<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast Money Duel</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#233c86,#080f27 70%);font-family:system-ui,-apple-system,sans-serif;color:#fff;min-height:100vh;display:flex;justify-content:center}main{width:min(100%,540px);padding:32px 20px}h1{font-size:clamp(34px,8vw,54px);text-align:center;margin:28px 0 4px;color:#ffcc45;text-shadow:0 4px #8c4918}h2{text-align:center;font-size:24px}.sub{text-align:center;color:#b6c5ee;margin-bottom:34px}.panel{background:#ffffff12;border:1px solid #ffffff30;border-radius:24px;padding:24px;margin:16px 0;box-shadow:0 15px 45px #0005}input{display:block;width:100%;padding:16px;margin:12px 0;border:2px solid #ffffff55;border-radius:12px;font-size:18px;background:#fff;color:#15254a}button{width:100%;border:0;border-radius:13px;background:#ffc83d;color:#18203d;padding:16px;font-size:19px;font-weight:800;cursor:pointer;margin:7px 0}button:disabled{opacity:.45}button.secondary{background:#d7e3ff}small,.muted{color:#c5d0ef}.code{text-align:center;font-size:42px;letter-spacing:7px;color:#ffce4c;font-weight:900}.scores{display:flex;justify-content:space-between;gap:12px}.score{flex:1;background:#111f4b;padding:16px;border-radius:14px;text-align:center}.score strong{font-size:30px;display:block;color:#ffcb48}.timer{font-size:32px;text-align:center;color:#ffcc45;font-weight:800}.answer{background:#263d78;padding:12px;border-radius:12px;margin:8px 0}.hidden{display:none}.error{color:#ffaaa9;text-align:center;min-height:24px}</style></head><body><main><h1>⚡ FAST MONEY DUEL</h1><p class="sub">Two phones. Five questions. One winner.</p><section id="home" class="panel"><input id="name" placeholder="Your name" maxlength="22"><button id="create">Create a game</button><p class="muted" style="text-align:center">— or join a friend —</p><input id="room" placeholder="6-letter room code" maxlength="6" style="text-transform:uppercase"><button class="secondary" id="join">Join game</button></section><section id="game" class="hidden"><div class="panel"><div id="status"></div><div id="scores" class="scores"></div><div id="play" class="hidden"><p id="round" class="muted"></p><div id="timer" class="timer"></div><h2 id="question"></h2><input id="answer" placeholder="Type your best answer" maxlength="80"><button id="submit">Lock in answer</button><p id="sent" class="muted"></p></div><div id="reveal" class="hidden"></div></div></section><p id="error" class="error"></p></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id);let current=null,tick=null;const saved=JSON.parse(localStorage.getItem('fmd-session')||'null');function err(s){$('error').textContent=s||''}function enter(data){localStorage.setItem('fmd-session',JSON.stringify(data));$('home').classList.add('hidden');$('game').classList.remove('hidden');err('')}function render(s){current=s;enter({code:s.code,token:JSON.parse(localStorage.getItem('fmd-session')||'{}').token});$('scores').innerHTML=s.players.map(p=>`<div class="score"><span></span><strong>${p.score}</strong><small></small></div>`).join('');[...$('scores').children].forEach((el,i)=>{el.querySelector('span').textContent=s.players[i].name;el.querySelector('small').textContent=s.players[i].connected?'Online':'Offline'});$('play').classList.toggle('hidden',s.status!=='playing');$('reveal').classList.toggle('hidden',s.status!=='reveal'&&s.status!=='finished');if(s.status==='waiting')$('status').innerHTML=`<h2>Waiting for player 2</h2><div class="code">${s.code}</div><p style="text-align:center">Share this code with your friend</p><button id="copy">Copy invite link</button>`;else $('status').innerHTML=s.status==='finished'?`<h2>🏆 ${s.players[0].score===s.players[1].score?'It’s a tie!':s.winner+' wins!'}</h2><button onclick="location.reload()">Play again</button>`:s.status==='reveal'?'<h2>Answer reveal!</h2>':'';if($('copy'))$('copy').onclick=()=>navigator.clipboard.writeText(location.origin+'/?room='+s.code).then(()=>err('Invite link copied!'));if(s.status==='playing'){$('round').textContent=`ROUND ${s.round+1} / ${s.total}`;$('question').textContent=s.question;const me=s.players.findIndex(p=>p.token===JSON.parse(localStorage.getItem('fmd-session')||'{}').token);const submitted=s.submitted[me];$('answer').disabled=submitted;$('submit').disabled=submitted;$('sent').textContent=submitted?'Answer locked! Waiting for opponent…':'';clearInterval(tick);const update=()=>{$('timer').textContent=Math.max(0,Math.ceil((s.deadline-Date.now())/1000))+'s'};update();tick=setInterval(update,250)}else clearInterval(tick);if(s.status==='reveal')$('reveal').innerHTML=s.answers.map(a=>`<div class="answer"><b></b><p></p><strong></strong></div>`).join('');if(s.status==='reveal')[...$('reveal').children].forEach((el,i)=>{const a=s.answers[i];el.querySelector('b').textContent=a.name;el.querySelector('p').textContent=a.answer+(a.matched?' → '+a.matched:'');el.querySelector('strong').textContent='+'+a.points+' points'});}
socket.on('state',render);$('create').onclick=()=>socket.emit('create',{name:$('name').value},r=>r.error?err(r.error):enter(r));$('join').onclick=()=>socket.emit('join',{code:$('room').value,name:$('name').value},r=>r.error?err(r.error):enter(r));$('submit').onclick=()=>{const answer=$('answer').value.trim();if(!answer)return err('Type an answer first');socket.emit('answer',{answer},r=>{if(r.error)err(r.error);else{$('answer').value='';err('')}})};$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')$('submit').click()});const room=new URLSearchParams(location.search).get('room');if(room)$('room').value=room;if(saved?.code&&saved?.token)socket.on('connect',()=>socket.emit('join',saved,r=>{if(r.error){localStorage.removeItem('fmd-session');err('Previous room expired. Start a new game.')}}));
</script></body></html>
